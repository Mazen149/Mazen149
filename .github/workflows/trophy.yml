name: Generate Trophy Card

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/trophy.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          path: assets/trophy.svg
          options: "username=${{ github.repository_owner }}&theme=dracula&row=1&column=6&margin-w=8&margin-h=8&no-bg=false&no-frame=false"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git diff --staged --quiet || (git commit -m "chore: update profile trophies [skip ci]" && git push)
